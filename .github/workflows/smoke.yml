name: smoke

# Eligibility requires the submission to be functional and publicly accessible
# through the judging window. A build that passed once says nothing about
# whether the site is up on day twelve, so this asks the deployment itself,
# every fifteen minutes.

# The site samples itself every five minutes on its own clock and publishes the
# history at /status, so the fifteen-minute GitHub schedule is off. It still runs
# on every push to main and by hand.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  smoke:
    name: production
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --ignore-scripts

      - name: Every route, the funnel, the sessions, the market
        env:
          SMOKE_BASE: ${{ vars.SMOKE_BASE || 'https://mandatemarkets.com' }}
        run: npm run smoke
